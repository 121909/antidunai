[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burst-guard"
version = "0.1.0"
description = "A single-account Telegram userbot that keeps one video from each message burst."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "burst-guard maintainers" }]
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "telethon>=1.40,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
burst-guard = "burst_guard.__main__:main"
burst-guard-login = "burst_guard.login:main"

[tool.hatch.build.targets.wheel]
packages = ["src/burst_guard"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["burst_guard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true
